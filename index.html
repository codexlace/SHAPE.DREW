<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oddlet – Tiny Creature Lab</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Oddlet Lab</h1>
    <p class="tagline">Roll a little creature, then draw it from shapes.</p>
  </header>
  <main>
    <section id="controls">
      <h2>Build your Oddlet</h2>
      <div class="control-row">
        <label>
          Mascot lane
          <select id="laneSelect"></select>
        </label>
        <label>
          Oddlet species
          <select id="speciesSelect"></select>
        </label>
        <label>
          Mood
          <select id="moodSelect"></select>
        </label>
        <label>
          Spark type
          <select id="sparkSelect"></select>
        </label>
        <label>
          Tiny twist
          <select id="twistSelect"></select>
        </label>
        <label>
          Little object
          <select id="objectSelect"></select>
        </label>
        <label>
          Shape limit
          <select id="shapeLimitSelect">
            <option value="3">3 shapes</option>
            <option value="5" selected>5 shapes</option>
            <option value="7">7 shapes</option>
            <option value="loose">Loose</option>
          </select>
        </label>
      </div>
      <button id="rollButton" type="button">Roll Oddlet</button>
    </section>
    <section id="output">
      <div id="blueprint" class="panel">
        <h2>Blueprint</h2>
        <svg id="blueprintSvg" viewBox="0 0 200 200" width="200" height="200"></svg>
        <div id="blueprintInfo"></div>
      </div>
      <div id="card" class="panel">
        <h2>Your Oddlet</h2>
        <p id="cardIdea"></p>
        <ul id="cardDetails"></ul>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
